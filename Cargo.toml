[package]
name = "aether-sniper"
version = "0.1.0"
edition = "2021"

[lib]
name = "aether_sniper"

[[bin]]
name = "aether-sniper"
path = "src/main.rs"

[[bin]]
name = "lab-bench"
path = "src/bin/lab-bench.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
spl-token = "4.0"
spl-token-2022 = "3.0"
spl-associated-token-account = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"  # For backtest scenario generation
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
csv = "1.3"
bs58 = "0.5"
bincode = "1.3"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
libc = "0.2"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4.0", features = ["derive"] }
ed25519-dalek = "1.0"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
crossbeam-channel = "0.5"
core_affinity = "0.8"
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
maud = { version = "0.26", features = ["axum"] }
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
